# Despliega a producción en Vercel cada vez que se sube a main. Ver README → "Publicar en Vercel".
#
# Así el dueño del embudo no depende de la máquina de nadie: lo que está en
# GitHub es lo que está en producción. Necesita tres secretos en el repo
# (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        token de la cuenta Vercel dueña del proyecto
#   VERCEL_ORG_ID       "orgId"     de .vercel/project.json
#   VERCEL_PROJECT_ID   "projectId" de .vercel/project.json
name: Deploy a Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas y tipos
        run: npm run verificar
      - name: Vercel CLI
        run: npm i -g vercel@latest
      - name: Traer configuración del proyecto
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
