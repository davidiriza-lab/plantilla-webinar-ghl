# En cada push a main corre las pruebas (tipos + 5 suites). Si falla, GitHub
# lo marca en rojo y el dueño se entera.
#
# El despliegue lo hace Vercel solo, con su integración de Git (ver README →
# "Publicar"). Este flujo SOLO despliega si además existen los tres secretos
# VERCEL_TOKEN, VERCEL_ORG_ID y VERCEL_PROJECT_ID en el repo — útil para
# quien prefiera que nada se publique sin pasar las pruebas.
name: Pruebas y deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas y tipos
        run: npm run verificar

      - name: ¿Hay secretos de Vercel?
        id: chk
        run: echo "ok=${{ secrets.VERCEL_TOKEN != '' && github.event_name == 'push' }}" >> "$GITHUB_OUTPUT"
      - name: Vercel CLI
        if: steps.chk.outputs.ok == 'true'
        run: npm i -g vercel@latest
      - name: Traer configuración del proyecto
        if: steps.chk.outputs.ok == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        if: steps.chk.outputs.ok == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        if: steps.chk.outputs.ok == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
